<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GlideBeam 是一款把 iPhone 变成 Mac 触控板的应用。">
  <title>GlideBeam · 指渡</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      background: light-dark(#f5f5f7, #111214);
      color: light-dark(#17181b, #f5f5f7);
      font: 1rem/1.6 system-ui, sans-serif;
    }
    main {
      box-sizing: border-box;
      min-height: 100svh;
      max-width: 46rem;
      margin: auto;
      padding: 3rem clamp(1.5rem, 6vw, 4rem);
      display: grid;
      align-content: center;
    }
    h1 {
      margin: 0;
      line-height: 1.1;
      letter-spacing: -.035em;
      font-size: clamp(2.65rem, 8vw, 4.8rem);
    }
    p {
      margin: 1.25rem 0 0;
      color: light-dark(#3d424c, #b9c0cb);
      font-size: clamp(1.05rem, 2.5vw, 1.4rem);
    }
  </style>
</head>
<body>
  <main>
    <h1>GlideBeam · 指渡</h1>
    <p>把你的 iPhone 变成 Mac 触控板。</p>
  </main>
</body>
</html>
